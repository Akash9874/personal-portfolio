[build]
  command = "npm run build"
  publish = "dist"

# Files in /assets carry a fingerprint in their name, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
